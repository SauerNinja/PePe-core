
name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (e.g. v2.9.0.6-test)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('test-{0}', github.run_number) }}

jobs:

  # --------------------------------------------------
  # Linux and Windows builds
  # --------------------------------------------------

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, host: x86_64-pc-linux-gnu, cross: "" }
          - { name: linux-arm64, host: aarch64-linux-gnu, cross: "g++-aarch64-linux-gnu binutils-aarch64-linux-gnu" }
          - { name: windows-x86_64, host: x86_64-w64-mingw32, cross: "g++-mingw-w64-x86-64" }

    env:
      DEBIAN_FRONTEND: noninteractive
      HOST: ${{ matrix.host }}
      PLATFORM: ${{ matrix.name }}

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y coreutils build-essential libtool autotools-dev automake pkg-config bsdmainutils curl ca-certificates git python3 zip unzip xz-utils bzip2 gperf gettext bison \
            libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-util-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev xkb-data ${{ matrix.cross }}

      - uses: actions/checkout@v4

      - name: Select POSIX threading for MinGW
        if: matrix.host == 'x86_64-w64-mingw32'
        run: |
          update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          key: depends-${{ matrix.name }}-${{ hashFiles('depends/packages/*', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*') }}

      - name: Build dependencies
        run: |
          set -euo pipefail
          JOBS=$(getconf _NPROCESSORS_ONLN)

          if [ "$HOST" = "aarch64-linux-gnu" ]; then
            python3 - <<'PY'
          from pathlib import Path

          p = Path("depends/funcs.mk")
          s = p.read_text()

          old = '\t$(AT)cd $$(@D); $(call $(1)_preprocess_cmds, $(1))'
          new = '\t$(AT)cd $$(@D); find . -name config.sub -exec cp $(BASEDIR)/config.sub {} \\; ; find . -name config.guess -exec cp $(BASEDIR)/config.guess {} \\; ; $(call $(1)_preprocess_cmds, $(1))'

          if old not in s:
              raise SystemExit("Could not find expected preprocessing command in depends/funcs.mk")

          p.write_text(s.replace(old, new, 1))

          q = Path("depends/packages/qt.mk")
          s = q.read_text()

          arm_option = '$(package)_config_opts_arm_linux  = -platform linux-g++ -xplatform $(host)\n'
          arm64_option = '$(package)_config_opts_aarch64_linux = -platform linux-g++ -xplatform linux-aarch64-gnu-g++\n'

          if arm64_option not in s:
              if arm_option not in s:
                  raise SystemExit("Could not find expected ARM Qt configuration option")
              s = s.replace(arm_option, arm_option + arm64_option, 1)

          marker = '  mkdir -p qtbase/mkspecs/macx-clang-linux &&\\\n'

          if 'qtbase/mkspecs/linux-aarch64-gnu-g++/qmake.conf' not in s:
              if marker not in s:
                  raise SystemExit("Could not find Qt preprocessing insertion point")

              addition = (
                  '  mkdir -p qtbase/mkspecs/linux-aarch64-gnu-g++ &&\\\n'
                  '  cp -a qtbase/mkspecs/linux-g++/. qtbase/mkspecs/linux-aarch64-gnu-g++/ &&\\\n'
                  "  printf '%s\\n' "
                  "'QMAKE_CC = aarch64-linux-gnu-gcc' "
                  "'QMAKE_CXX = aarch64-linux-gnu-g++' "
                  "'QMAKE_LINK = aarch64-linux-gnu-g++' "
                  "'QMAKE_LINK_SHLIB = aarch64-linux-gnu-g++' "
                  "'QMAKE_AR = aarch64-linux-gnu-ar cqs' "
                  "'QMAKE_NM = aarch64-linux-gnu-nm -P' "
                  "'QMAKE_OBJCOPY = aarch64-linux-gnu-objcopy' "
                  "'QMAKE_STRIP = aarch64-linux-gnu-strip' "
                  "'QMAKE_RANLIB = aarch64-linux-gnu-ranlib' "
                  '>> qtbase/mkspecs/linux-aarch64-gnu-g++/qmake.conf &&\\\n'
              )

              s = s.replace(marker, addition + marker, 1)

          q.write_text(s)
          PY

            command -v aarch64-linux-gnu-gcc
            command -v aarch64-linux-gnu-g++
          fi

          make -C depends HOST="$HOST" -j"$JOBS"

      - name: Build wallet
        run: |
          set -euo pipefail
          JOBS=$(getconf _NPROCESSORS_ONLN)
          SITE=$(find "$PWD/depends" -path '*/share/config.site' -type f -print -quit)
          test -n "$SITE"

          ./autogen.sh
          CONFIG_SITE="$SITE" ./configure --prefix=/ --disable-tests --disable-bench --without-libs
          make -j"$JOBS"
          make install-strip DESTDIR="$PWD/stage"

      - name: Package and checksum binaries
        run: |
          set -euo pipefail

          NAME="PEPEPOW-${TAG}-${GITHUB_SHA::7}-${PLATFORM}"
          mkdir -p "pkg/$NAME" out

          test -d stage/bin
          cp -a stage/bin/. "pkg/$NAME/"

          cd "pkg/$NAME"
          find . -type f ! -name 'BINARY-SHA256SUMS.txt' \
            -exec sha256sum {} \; > BINARY-SHA256SUMS.txt
          cd ../..

          test -s "pkg/$NAME/BINARY-SHA256SUMS.txt"

          if [ "$PLATFORM" = "windows-x86_64" ]; then
            zip -r "out/$NAME.zip" "pkg/$NAME"
          else
            tar -czf "out/$NAME.tar.gz" -C pkg "$NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pepepow-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # --------------------------------------------------
  # Native macOS Intel build
  # --------------------------------------------------

  build-macos:
    name: Build macOS Intel
    runs-on: macos-15-intel
    timeout-minutes: 360

    env:
      HOST: x86_64-apple-darwin11
      PLATFORM: macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euo pipefail

          brew update
          brew install autoconf automake libtool pkg-config

          xcode-select -p
          xcrun --sdk macosx --show-sdk-path

          # Provide the GNU libtoolize name expected by autotools.
          mkdir -p "$RUNNER_TEMP/gnu-libtool-bin"
          ln -sf "$(command -v glibtoolize)" "$RUNNER_TEMP/gnu-libtool-bin/libtoolize"
          echo "$RUNNER_TEMP/gnu-libtool-bin" >> "$GITHUB_PATH"

      - name: Cache macOS dependencies
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          key: depends-macos-x86_64-${{ hashFiles('depends/packages/*', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*') }}

      - name: Build macOS dependencies
        run: |
          set -euo pipefail

          JOBS=$(sysctl -n hw.ncpu)

          # Use a deployment target supported by current Xcode.
          make -C depends \
            HOST="$HOST" \
            OSX_MIN_VERSION=10.13 \
            -j"$JOBS"

      - name: Build macOS wallet
        run: |
          set -euo pipefail

          SITE=$(find "$PWD/depends" -path '*/share/config.site' -type f -print -quit)
          test -n "$SITE"

          ./autogen.sh

          CONFIG_SITE="$SITE" ./configure \
            --prefix=/ \
            --disable-tests \
            --disable-bench \
            --without-libs

          JOBS=$(sysctl -n hw.ncpu)
          make -j"$JOBS"
          make install-strip DESTDIR="$PWD/stage"

      - name: Package macOS binaries and checksums
        run: |
          set -euo pipefail

          NAME="PEPEPOW-${TAG}-${GITHUB_SHA::7}-${PLATFORM}"
          mkdir -p "pkg/$NAME" out

          test -d stage/bin
          cp -a stage/bin/. "pkg/$NAME/"

          cd "pkg/$NAME"

          find . -type f ! -name 'BINARY-SHA256SUMS.txt' \
            -exec shasum -a 256 {} \; > BINARY-SHA256SUMS.txt

          cd ../..

          test -s "pkg/$NAME/BINARY-SHA256SUMS.txt"

          ditto -c -k --sequesterRsrc --keepParent \
            "pkg/$NAME" "out/$NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pepepow-macos-x86_64
          path: out/*
          if-no-files-found: error

  # --------------------------------------------------
  # Verify and publish all four platforms
  # --------------------------------------------------

  release:
    name: Publish release
    needs: [build, build-macos]
    if: ${{ needs.build.result == 'success' && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: pepepow-*
          merge-multiple: true
          path: dist

      - name: Verify all four platform packages
        run: |
          set -euo pipefail

          test -n "$(find dist -maxdepth 1 -name '*linux-x86_64.tar.gz' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*linux-arm64.tar.gz' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*windows-x86_64.zip' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*macos-x86_64.zip' -print -quit)"

          COUNT=$(find dist -maxdepth 1 -type f \( \
            -name '*linux-x86_64.tar.gz' -o \
            -name '*linux-arm64.tar.gz' -o \
            -name '*windows-x86_64.zip' -o \
            -name '*macos-x86_64.zip' \
          \) | wc -l)

          test "$COUNT" -eq 4

      - name: Generate archive checksums
        run: |
          set -euo pipefail

          cd dist
          sha256sum PEPEPOW-* > SHA256SUMS-ARCHIVES.txt
          cd ..

      - name: Extract packages for binary checksums
        run: |
          set -euo pipefail

          mkdir -p expanded

          for f in dist/PEPEPOW-*; do
            case "$f" in
              *.tar.gz)
                tar -xzf "$f" -C expanded
                ;;
              *.zip)
                unzip -q "$f" -d expanded
                ;;
              *)
                echo "Unexpected package: $f"
                exit 1
                ;;
            esac
          done

          test -n "$(find expanded -type f -name 'BINARY-SHA256SUMS.txt' -print -quit)"

      - name: Generate release-wide binary checksums
        run: |
          set -euo pipefail

          cd expanded

          find . -type f ! -name 'BINARY-SHA256SUMS.txt' \
            -print0 | sort -z | xargs -0 sha256sum \
            > ../dist/SHA256SUMS-BINARIES.txt

          test -s ../dist/SHA256SUMS-BINARIES.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/PEPEPOW-*

      - name: Compose release notes
        run: |
          set -euo pipefail

          SHORT=${GITHUB_SHA::7}
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          PREV=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}${GITHUB_SHA}"
          ROOT=$(git rev-list --max-parents=0 HEAD | tail -n1)
          BASE="${PREV:-$ROOT}"

          {
            echo "# PEPEPOW ${TAG}"
            echo
            echo "Wallet, daemon and CLI builds from this repository."
            echo
            echo "## Downloads"
            echo
            echo "| Platform | File | Size |"
            echo "| --- | --- | --- |"

            for f in dist/PEPEPOW-*; do
              case "$f" in
                *windows-x86_64*) P="Windows 64-bit" ;;
                *linux-arm64*) P="Linux ARM64" ;;
                *linux-x86_64*) P="Linux x86_64" ;;
                *macos-x86_64*) P="macOS Intel 64-bit (Apple Silicon via Rosetta)" ;;
                *) P="Other" ;;
              esac

              echo "| ${P} | \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done

            echo
            echo "## Checksums"
            echo
            echo "- SHA256SUMS-ARCHIVES.txt verifies the downloadable ZIP and TAR.GZ files."
            echo "- SHA256SUMS-BINARIES.txt verifies every packaged binary."
            echo "- Every platform package also contains BINARY-SHA256SUMS.txt."
            echo
            echo "## Authenticity"
            echo
            echo "Packages were built by GitHub Actions from commit \`${SHORT}\`."
            echo
            echo "- Windows: not code-signed; SmartScreen may ask for confirmation."
            echo "- Linux: built on Ubuntu 20.04; needs glibc 2.31 or newer."
            echo "- macOS: Intel x86_64 build, with a 10.13 deployment target."
            echo "- Package files carry GitHub build-provenance attestations."
            echo
            echo "Verify a package with \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
            echo
            echo "## Changes since ${BASE}"
            echo
            echo "$(git rev-list --count "${BASE}..${GITHUB_SHA}") commits, $(git diff --shortstat "${BASE}" "${GITHUB_SHA}")."

            if [ -n "$PREV" ]; then
              echo "Full comparison: ${REPO_URL}/compare/${PREV}...${SHORT}"
            fi

            echo
            git log --pretty=format:'- %s (%h) — %an' "${RANGE}" | head -n 400

          } > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PRE=""
          case "$TAG" in
            *-*) PRE="--prerelease" ;;
          esac

          gh release create "$TAG" dist/* \
            --title "PEPEPOW ${TAG}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            $PRE
